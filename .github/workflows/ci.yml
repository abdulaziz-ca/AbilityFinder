name: CI

# Why this exists: git push to main triggers a Cloudflare Workers Build directly.
# Before this workflow, nothing ran the test suite on the way to production, so a
# red suite could ship — and on 2026-07-27 it did, twice, because a truncated
# terminal read hid Playwright's "N failed" header. This makes the result visible
# on every push regardless of what any human reads.
#
# NOTE: this reports status only. It does not yet BLOCK the deploy, because
# Workers Builds deploys straight off the push. Closing that gap needs a
# Cloudflare API token stored as a repository secret so `wrangler deploy` can move
# into this workflow — see REMAINING-WORK.md, "Planned procedure", step 0.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    # The three-engine matrix takes about 13 minutes on a runner, plus install
    # time. 20 was cutting it close enough to risk a false failure.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the local toolchain (Node 26).
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Playwright browser binaries are not in node_modules; --with-deps also
      # pulls the system libraries each engine needs on CI. All three are required
      # because the suite runs a Chromium/Firefox/WebKit matrix — WebKit most of
      # all, since this is a disability product whose audience skews to iOS.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Generated files must reproduce from their scripts. If a generated artifact
      # was hand-edited, or someone forgot to regenerate after a data change, the
      # working tree will be dirty here and this step fails.
      - name: Verify generated files reproduce
        run: |
          npm run gen:context
          npm run gen:guides
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'npm run gen:context && npm run gen:guides' and commit the result."
            git status --short
            git diff
            exit 1
          fi

      - name: Unit tests
        run: npm test

      # Two Playwright projects run here. "app" uses a static server; "worker"
      # boots `wrangler dev --local`, which is what makes the production CSP,
      # the security headers and the /api/* contracts testable at all. Local mode
      # needs no Cloudflare credentials: KV, send_email, the rate limiter and
      # assets are simulated, and the AI binding is unsupported locally — which is
      # fine, because no test depends on a successful /api/ask.
      # No --reporter flag here on purpose: a CLI reporter OVERRIDES the config,
      # which is what silently disabled the "github" reporter on the first runs
      # and left annotations saying only "exit code 1". The config already picks
      # github + line when CI is set.
      - name: Browser and Worker tests
        run: npx playwright test
        env:
          # Wrangler otherwise prompts about telemetry on first run, which would
          # hang a non-interactive runner.
          WRANGLER_SEND_METRICS: 'false'

      # Keeps SUPPLY-01 from regressing. Production dependencies must stay clean;
      # dev-only advisories are reported but do not fail the build, because they
      # are frequently out of our control and turning CI red for them trains
      # people to ignore it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # THE GATE — inert until the owner completes two steps they alone can do.
  #
  # Right now this job does nothing but warn. CI reports; it does not block.
  # Workers Builds still deploys straight off the push, which is how three red
  # runs reached production on 2026-07-27/28.
  #
  # To turn this into a real gate:
  #
  #   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token.
  #      Use the "Edit Cloudflare Workers" template, or a custom token scoped to
  #      Account / Workers Scripts / Edit for THIS account only. Nothing broader.
  #   2. GitHub -> repo Settings -> Secrets and variables -> Actions ->
  #      New repository secret, named exactly CLOUDFLARE_API_TOKEN.
  #   3. Cloudflare dashboard -> Workers & Pages -> abilityfinder -> Settings ->
  #      Build -> DISCONNECT the git integration.
  #
  # Step 3 is not optional. If the secret is added while Workers Builds is still
  # connected, BOTH will deploy on every push: this job after the tests pass, and
  # Workers Builds immediately regardless of them. That is worse than today,
  # because it looks gated while a red build still ships.
  #
  # Once all three are done, `needs: test` makes the deploy conditional on the
  # full suite passing, and a red suite can no longer reach production.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy (skips cleanly until the token exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so this job deployed nothing. Workers Builds is still deploying on push, which means CI reports but does not gate. See the comment above this job in .github/workflows/ci.yml for the three steps to activate it."
            exit 0
          fi
          npx wrangler deploy
