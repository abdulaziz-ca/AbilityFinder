name: CI

# Why this exists: before this workflow, nothing ran the test suite on the way to
# production, so a red suite could ship — and on 2026-07-27 it did, twice, because
# a truncated terminal read hid Playwright's "N failed" header.
#
# STATUS: the gate is LIVE. It is no longer report-only. All three enabling steps
# were completed on 2026-07-28 and all three outcomes were observed — red+skipped
# while Workers Builds still shipped, red+skipped with nothing shipped, and
# green+deployed verified live. See REMAINING-WORK.md, "Pre-deploy gate".
# The comment that used to sit here said the gate was inert; that was true when
# written and is now wrong. Do not reintroduce it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    # The three-engine matrix takes about 13 minutes on a runner. 30 was not enough:
    # on 2026-07-28 a 16m37s browser download pushed the job past the cap and it was
    # cancelled mid-suite, which also blocked the deploy through `needs: test`. The
    # cache above should keep normal runs near 15 minutes; 45 leaves room for a slow
    # mirror on a cache miss while still catching a genuine hang.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # WHY 0: test/data-procedure.test.js resolves a git baseline to prove a data
          # change also bumped the shared ?v=N and appended a DATA_CHANGELOG entry.
          # actions/checkout defaults to depth 1, where no comparison ref exists and
          # HEAD looks like a root commit, so the guard fails closed with
          # "the git baseline is unavailable" and blocks the deploy through
          # `needs: test`. Verified 2026-08-16 by running the guard against a
          # `clone --depth 1` of a correctly-executed data change: 2 of 4 tests fail
          # shallow and all 4 pass with full history. Do not reintroduce a shallow
          # checkout here without making that guard baseline-free.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the local toolchain (Node 26).
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Playwright browser binaries are not in node_modules; --with-deps also
      # pulls the system libraries each engine needs on CI. All three are required
      # because the suite runs a Chromium/Firefox/WebKit matrix — WebKit most of
      # all, since this is a disability product whose audience skews to iOS.
      # Cached because on 2026-07-28 this download took 16m37s on one runner and the
      # job hit its 30-minute cap mid-suite and was CANCELLED. The tests were fine.
      # A cancelled test job also blocks the deploy through `needs: test`, so a slow
      # mirror became a release blocker. The cache key is the resolved Playwright
      # version, so a version bump invalidates it automatically.
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require(@playwright/test/package.json).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # On a cache miss, fetch the browsers AND their apt dependencies.
      #
      # DELIBERATELY UNBOUNDED, and that is a known residual gap, not an oversight.
      # This path only runs on a @playwright/test version bump or a cache eviction: it
      # did not execute once in the 40 most recent runs, so there is nothing to set a
      # bound from, and a guessed one would most likely fire on exactly the rare version
      # bump it was meant to protect.
      #
      # BUDGET WARNING for whoever hits a cache miss: this path may already be close to
      # the 45-minute job cap WITHOUT anything hanging. The recorded browser download is
      # 16m37s (2026-07-28) and the apt half has been observed at 13m11s — 29m48s
      # together, plus the ~13-minute three-engine matrix is 42m48s, leaving 2m12s for
      # checkout, Node setup and npm ci, which exceed that. If a cache-miss run is
      # cancelled at the cap, suspect this arithmetic before suspecting the commit, and
      # capture the step durations: they are the measurement needed to bound this step.
      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # On a cache hit the binaries are restored but the apt packages are NOT — they
      # live outside ~/.cache/ms-playwright. WebKit in particular will not launch
      # without them, so install just the system dependencies.
      # BOUNDED because an unbounded apt can consume the whole job. On 2026-08-19 this
      # step stalled after fetching the InRelease files and emitted nothing for 44
      # minutes, until the job-level timeout-minutes: 45 cancelled the job. A cancelled
      # test job blocks the deploy exactly like a red one (needs: test), so a healthy
      # commit did not release, and the failure showed up as a bare cancellation with no
      # error naming a cause.
      #
      # WHY 20 AND NOT LESS: this step is apt-only, but it is NOT fast. Measured across
      # the 12 runs of 2026-08-18/19, all successful: 0m25s, 0m39s, 0m40s, 0m57s, 1m15s,
      # 2m14s, 4m48s, 6m17s, 7m01s, 7m23s, 9m00s, 13m11s. 20 minutes sits ~52% above the
      # slowest success and still leaves 25 of the job's 45 minutes for a suite that
      # normally lands near 14.
      #
      # READ 20 AS "reasonable on current evidence", NOT as "proven safe". Twelve
      # samples from a two-day window say nothing about the long tail, and apt duration
      # here is mirror-dominated. If a legitimate run ever exceeds it, RAISE the bound
      # and record the new measurement. Do not delete it — that restores the 45-minute
      # silent failure this exists to prevent.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 20
        run: npx playwright install-deps chromium firefox webkit

      # Generated files must reproduce from their scripts. If a generated artifact
      # was hand-edited, or someone forgot to regenerate after a data change, the
      # working tree will be dirty here and this step fails.
      - name: Verify generated files reproduce
        run: |
          npm run gen:context
          npm run gen:guides
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'npm run gen:context && npm run gen:guides' and commit the result."
            git status --short
            git diff
            exit 1
          fi

      - name: Unit tests
        run: npm test
        env:
          # WHY: test/data-procedure.test.js needs a baseline commit to prove a data
          # change also moved the shared ?v=N and appended a DATA_CHANGELOG entry.
          # Declare it from the event rather than letting the test guess from refs:
          # on a push, actions/checkout points origin/main at the pushed commit, so
          # merge-base(HEAD, origin/main) == HEAD and that candidate is rejected. The
          # guess then survives only on leftover merged feature branches, so deleting
          # them would silently start failing every data deploy. github.event.before
          # is the previous tip of this ref; pull_request.base.sha is the PR base.
          # workflow_dispatch supplies neither, so the value is empty there; the guard
          # then uses HEAD's first parent, which is the right question for a manual run
          # ("what did this commit change") and is deterministic rather than a ref guess.
          # An all-zero, non-ancestor, missing, or HEAD-equal value fails closed instead
          # of guessing, because a wrong baseline passes the guard vacuously.
          DATA_PROCEDURE_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # Two Playwright projects run here. "app" uses a static server; "worker"
      # boots `wrangler dev --local`, which is what makes the production CSP,
      # the security headers and the /api/* contracts testable at all. Local mode
      # needs no Cloudflare credentials: KV, send_email, the rate limiter and
      # assets are simulated, and the AI binding is unsupported locally — which is
      # fine, because no test depends on a successful /api/ask.
      # No --reporter flag here on purpose: a CLI reporter OVERRIDES the config,
      # which is what silently disabled the "github" reporter on the first runs
      # and left annotations saying only "exit code 1". The config already picks
      # github + line when CI is set.
      - name: Browser and Worker tests
        run: npx playwright test
        env:
          # Wrangler otherwise prompts about telemetry on first run, which would
          # hang a non-interactive runner.
          WRANGLER_SEND_METRICS: 'false'

      # Keeps SUPPLY-01 from regressing. Production dependencies must stay clean;
      # dev-only advisories are reported but do not fail the build, because they
      # are frequently out of our control and turning CI red for them trains
      # people to ignore it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # THE GATE — live since 2026-07-28. This job is the only AUTOMATED push-to-main
  # path to production. It is not the only path at all: `npx wrangler deploy` still
  # deploys directly from a working tree and bypasses this gate entirely, which
  # DEPLOY.md documents as a recovery route.
  #
  # `needs: test` makes the deploy conditional on the full suite passing, so a red
  # suite cannot reach production *through this workflow*.
  #
  # Only the gate WIRING is provable from this repository — `needs: test` below.
  # The other two enabling facts are owner-observed external conditions, recorded
  # in REMAINING-WORK.md, that no file here can assert: that CLOUDFLARE_API_TOKEN
  # exists as a repository secret, and that Workers Builds' git integration is
  # DISCONNECTED. It was disconnected by the owner on 2026-07-28 and the effect was
  # observed: two red runs shipped nothing afterwards, where an earlier red run had
  # shipped. Successful deploys have since been observed repeatedly, most recently
  # on 2026-08-16, but observation is not proof the token is still present.
  #
  # That third step is not optional and must stay done. If Workers Builds is ever
  # reconnected while the secret exists, BOTH deploy on every push: this job after
  # the tests pass, and Workers Builds immediately regardless of them — which is
  # worse than no gate, because it looks gated while a red build still ships.
  #
  # If the CLOUDFLARE_API_TOKEN secret is absent this job warns and exits 0 without
  # deploying, so a green run is not by itself proof that a release happened.
  # Confirm against the live site. See DEPLOY.md, "Post-deploy verification".
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy (skips cleanly until the token exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so this job deployed nothing. Workers Builds' git integration was disconnected on 2026-07-28, so this push most likely produced NO RELEASE AT ALL despite the green run — confirm against the live site before assuming otherwise. Restore the secret (repo Settings -> Secrets and variables -> Actions -> CLOUDFLARE_API_TOKEN), or deploy manually with npx wrangler deploy, which bypasses this gate."
            exit 0
          fi
          npx wrangler deploy
